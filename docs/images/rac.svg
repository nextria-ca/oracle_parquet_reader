  <rect x="250" y="355" width="460" height="20" rx="4" fill="#FFFFFF"/>
  <text x="480" y="370" font-size="12" fill="#7F1D1D" text-anchor="middle">cluster interconnect · one parallel INSERT spanning all instances</text>
  <text x="48" y="400" font-size="11.5" font-weight="600" fill="#2563EB">reads parts + Parquet</text>
  <text x="912" y="400" font-size="11.5" font-weight="600" fill="#C74634" text-anchor="end">writes rows</text>

  <!-- storage -->
  <rect x="30" y="424" width="560" height="112" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="48" y="450" font-size="15" font-weight="700" fill="#1E3A8A">Shared file system (NFS, ACFS, …), same paths on every node</text>
  <text x="48" y="476" class="s">Parquet files · .pqpart parts · pqora.py + Python with pyarrow</text>
  <text x="48" y="496" class="s">log directory: stream log (records the host of each part), bad files</text>
  <text x="48" y="516" class="s">directory objects are database-wide, so one set serves every instance</text>

  <rect x="610" y="424" width="320" height="112" rx="12" fill="#C74634"/>
  <text x="628" y="450" font-size="15" font-weight="700" fill="#FFFFFF">Shared database storage</text>
  <text x="628" y="476" font-size="11.5" fill="#FFE4DE">target table SALES</text>
  <text x="628" y="496" font-size="11.5" fill="#FFE4DE">parallel direct-path insert</text>
  <text x="628" y="516" font-size="11.5" fill="#FFE4DE">from every instance at once</text>
