  <!-- interconnect -->
  <line x1="310" y1="215" x2="340" y2="215" stroke="#C74634" stroke-width="3"/>
  <line x1="620" y1="215" x2="650" y2="215" stroke="#C74634" stroke-width="3"/>

  <!-- data paths -->
  <g stroke-width="1.6" fill="none">
    <path d="M120,424 L120,350" stroke="#2563EB" marker-end="url(#ab)"/>
    <path d="M410,424 L430,350" stroke="#2563EB" marker-end="url(#ab)"/>
    <path d="M560,424 L740,350" stroke="#2563EB" marker-end="url(#ab)"/>
    <path d="M220,346 L670,420" stroke="#C74634" marker-end="url(#ac)"/>
