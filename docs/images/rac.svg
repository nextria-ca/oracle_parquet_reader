    <path d="M164,224 L150,224" class="ln"/>
    <text x="48" y="268" class="s">CPU cores</text>
    <g class="core">
      <rect x="48" y="276" width="26" height="18" rx="3"/><rect x="78" y="276" width="26" height="18" rx="3"/><rect x="108" y="276" width="26" height="18" rx="3"/><rect x="138" y="276" width="26" height="18" rx="3"/><rect x="168" y="276" width="26" height="18" rx="3"/><rect x="198" y="276" width="26" height="18" rx="3"/><rect x="228" y="276" width="26" height="18" rx="3"/><rect x="258" y="276" width="26" height="18" rx="3"/>
