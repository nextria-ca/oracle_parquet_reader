<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C74634"/></marker>
    <style>
      .t  { font-size: 22px; font-weight: 700; fill: #0F172A; }
      .st { font-size: 13px; fill: #64748B; }
      .h  { font-size: 15px; font-weight: 700; fill: #7F1D1D; }
      .s  { font-size: 11.5px; fill: #475569; }
      .px { font-size: 11.5px; font-weight: 600; fill: #7F1D1D; }
      .pq { font-size: 11.5px; font-weight: 600; fill: #065F46; }
      .ln { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
      .core { fill: #10B981; }
    </style>
  </defs>
  <rect width="960" height="560" rx="16" fill="#FFFFFF"/>
  <text x="30" y="42" class="t">Real Application Clusters: every node decodes Parquet</text>
  <text x="30" y="64" class="st">Oracle spreads PX servers across instances. Each one starts its pqora process on its own node, using that node's CPUs.</text>

  <!-- node template x offsets: 30, 340, 650 ; width 280 -->
