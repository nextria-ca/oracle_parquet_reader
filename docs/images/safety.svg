<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .t  { font-size: 22px; font-weight: 700; fill: #0F172A; }
      .st { font-size: 13px; fill: #64748B; }
      .h  { font-size: 16px; font-weight: 700; fill: #FFFFFF; }
      .i  { font-size: 12.5px; fill: #1E293B; }
      .d  { font-size: 11.5px; fill: #64748B; }
      .ck { font-size: 13px; font-weight: 700; }
    </style>
  </defs>
  <rect width="960" height="470" rx="16" fill="#FFFFFF"/>
  <text x="30" y="42" class="t">Fail loudly, never silently</text>
  <text x="30" y="64" class="st">If a value would be stored differently from the source, the load stops with a message naming the column and the value.</text>

  <!-- column 1 -->
  <rect x="30" y="84" width="290" height="300" rx="12" fill="#F0FDF4" stroke="#059669" stroke-width="1.3"/>
  <path d="M30,96 a12,12 0 0 1 12,-12 h266 a12,12 0 0 1 12,12 v26 h-290 z" fill="#059669"/>
  <text x="48" y="109" class="h">Before: generate</text>
  <g>
    <text x="48" y="148" class="ck" fill="#059669">✓</text><text x="68" y="148" class="i">All files share one schema</text>
    <text x="48" y="182" class="ck" fill="#059669">✓</text><text x="68" y="182" class="i">Every date and timestamp checked</text>
    <text x="68" y="199" class="d">against Oracle's range, in every row group</text>
    <text x="68" y="214" class="d">(from Parquet statistics, so usually free)</text>
    <text x="48" y="246" class="ck" fill="#059669">✓</text><text x="68" y="246" class="i">Year 0 and the 1582 calendar gap</text>
    <text x="48" y="280" class="ck" fill="#059669">✓</text><text x="68" y="280" class="i">Column sizes measured from data</text>
    <text x="68" y="297" class="d">with value counts per size band</text>
    <text x="48" y="329" class="ck" fill="#059669">✓</text><text x="68" y="329" class="i">Interval-like dates spotted</text>
    <text x="68" y="346" class="d">(years 0000-0001) and loaded as numbers</text>
  </g>

  <!-- column 2 -->
  <rect x="335" y="84" width="290" height="300" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.3"/>
  <path d="M335,96 a12,12 0 0 1 12,-12 h266 a12,12 0 0 1 12,12 v26 h-290 z" fill="#D97706"/>
  <text x="353" y="109" class="h">During: every load</text>
  <g>
    <text x="353" y="148" class="ck" fill="#D97706">✓</text><text x="373" y="148" class="i">Parquet file unchanged</text>
    <text x="373" y="165" class="d">size and rows per row group re-checked</text>
    <text x="353" y="197" class="ck" fill="#D97706">✓</text><text x="373" y="197" class="i">Every value fits its column</text>
    <text x="373" y="214" class="d">no silent truncation</text>
    <text x="353" y="246" class="ck" fill="#D97706">✓</text><text x="373" y="246" class="i">Every record fits the read buffer</text>
    <text x="353" y="280" class="ck" fill="#D97706">✓</text><text x="373" y="280" class="i">Unstorable dates: you choose</text>
    <text x="373" y="297" class="d">error (default), NULL or clamp</text>
    <text x="353" y="329" class="ck" fill="#D97706">✓</text><text x="373" y="329" class="i">REJECT LIMIT 0 by default</text>
    <text x="373" y="346" class="d">one rejected row stops the load</text>
  </g>

  <!-- column 3 -->
  <rect x="640" y="84" width="290" height="300" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.3"/>
  <path d="M640,96 a12,12 0 0 1 12,-12 h266 a12,12 0 0 1 12,12 v26 h-290 z" fill="#2563EB"/>
  <text x="658" y="109" class="h">After: verify</text>
  <g>
    <text x="658" y="148" class="ck" fill="#2563EB">✓</text><text x="678" y="148" class="i">Loaded rows = expected rows</text>
    <text x="678" y="165" class="d">checked at the end of the SQL script</text>
    <text x="658" y="197" class="ck" fill="#2563EB">✓</text><text x="678" y="197" class="i">Manifest queryable in SQL</text>
    <text x="678" y="214" class="d">rows per source file, per part, per column</text>
    <text x="658" y="246" class="ck" fill="#2563EB">✓</text><text x="678" y="246" class="i">Rejected rows can be reloaded</text>
    <text x="678" y="263" class="d">EXT_&lt;table&gt;_BAD reads the bad files</text>
    <text x="658" y="295" class="ck" fill="#2563EB">✓</text><text x="678" y="295" class="i">Test kit: checksum of every column</text>
    <text x="678" y="312" class="d">Oracle vs pyarrow, bit-exact floats,</text>
    <text x="678" y="327" class="d">also under German NLS settings</text>
  </g>

  <!-- footer -->
  <rect x="30" y="402" width="900" height="48" rx="10" fill="#0F172A"/>
  <text x="150" y="431" font-size="14" fill="#FFFFFF">Something too big? <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace" fill="#6EE7B7">pqora.py resize --auto-field-size-fix</tspan> reads the logs and fixes it, no rescan.</text>
</svg>
