<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
    <style>
      .t  { font-size: 22px; font-weight: 700; fill: #0F172A; }
      .st { font-size: 13px; fill: #64748B; }
      .h  { font-size: 16px; font-weight: 700; fill: #0F172A; }
      .s  { font-size: 12px; fill: #475569; }
      .w  { font-size: 12px; font-weight: 600; }
      .rg { fill: #93C5FD; }
      .cap { font-size: 14px; font-weight: 700; }
    </style>
  </defs>
  <rect width="960" height="470" rx="16" fill="#FFFFFF"/>
  <text x="30" y="42" class="t">One big file, many workers</text>
  <text x="30" y="64" class="st">A Parquet file is split into row groups that can be read independently. pqora gives each one to its own worker.</text>

  <!-- LEFT PANEL -->
  <rect x="30" y="84" width="440" height="360" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="50" y="112" class="h">The whole file is one parallel unit</text>
  <text x="50" y="131" class="s">one reader decodes everything, the other workers wait</text>

  <rect x="60" y="148" width="110" height="250" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="115" y="416" class="s" text-anchor="middle">sales.parquet</text>
  <g>
    <rect x="68" y="154" width="94" height="26" rx="3" class="rg"/>
    <rect x="68" y="184" width="94" height="26" rx="3" class="rg"/>
    <rect x="68" y="214" width="94" height="26" rx="3" class="rg"/>
    <rect x="68" y="244" width="94" height="26" rx="3" class="rg"/>
    <rect x="68" y="274" width="94" height="26" rx="3" class="rg"/>
    <rect x="68" y="304" width="94" height="26" rx="3" class="rg"/>
    <rect x="68" y="334" width="94" height="26" rx="3" class="rg"/>
    <rect x="68" y="364" width="94" height="26" rx="3" class="rg"/>
  </g>
  <path d="M170,272 C230,272 230,170 290,169" stroke="#B45309" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <g>
    <rect x="295" y="154" width="150" height="26" rx="5" fill="#F59E0B"/>
    <text x="370" y="172" class="w" fill="#FFFFFF" text-anchor="middle">worker 1 · busy</text>
    <rect x="295" y="184" width="150" height="26" rx="5" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="370" y="202" class="w" fill="#94A3B8" text-anchor="middle">worker 2 · idle</text>
    <rect x="295" y="214" width="150" height="26" rx="5" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="370" y="232" class="w" fill="#94A3B8" text-anchor="middle">worker 3 · idle</text>
    <rect x="295" y="244" width="150" height="26" rx="5" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="370" y="262" class="w" fill="#94A3B8" text-anchor="middle">worker 4 · idle</text>
    <rect x="295" y="274" width="150" height="26" rx="5" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="370" y="292" class="w" fill="#94A3B8" text-anchor="middle">worker 5 · idle</text>
    <rect x="295" y="304" width="150" height="26" rx="5" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="370" y="322" class="w" fill="#94A3B8" text-anchor="middle">worker 6 · idle</text>
    <rect x="295" y="334" width="150" height="26" rx="5" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="370" y="352" class="w" fill="#94A3B8" text-anchor="middle">worker 7 · idle</text>
    <rect x="295" y="364" width="150" height="26" rx="5" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="370" y="382" class="w" fill="#94A3B8" text-anchor="middle">worker 8 · idle</text>
  </g>
  <text x="370" y="420" class="cap" fill="#B45309" text-anchor="middle">1 of 8 workers busy</text>

  <!-- RIGHT PANEL -->
  <rect x="490" y="84" width="440" height="360" rx="12" fill="#F0FDF4" stroke="#059669" stroke-width="1.2"/>
  <text x="510" y="112" class="h">pqora: each row group is a parallel unit</text>
  <text x="510" y="131" class="s">every worker decodes its own row group</text>

  <rect x="520" y="148" width="110" height="250" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="575" y="416" class="s" text-anchor="middle">sales.parquet</text>
  <g>
    <rect x="528" y="154" width="94" height="26" rx="3" class="rg"/>
    <rect x="528" y="184" width="94" height="26" rx="3" class="rg"/>
    <rect x="528" y="214" width="94" height="26" rx="3" class="rg"/>
    <rect x="528" y="244" width="94" height="26" rx="3" class="rg"/>
    <rect x="528" y="274" width="94" height="26" rx="3" class="rg"/>
    <rect x="528" y="304" width="94" height="26" rx="3" class="rg"/>
    <rect x="528" y="334" width="94" height="26" rx="3" class="rg"/>
    <rect x="528" y="364" width="94" height="26" rx="3" class="rg"/>
    <text x="575" y="172" class="s" fill="#1E3A8A" text-anchor="middle">row group 0</text>
    <text x="575" y="202" class="s" fill="#1E3A8A" text-anchor="middle">row group 1</text>
    <text x="575" y="232" class="s" fill="#1E3A8A" text-anchor="middle">row group 2</text>
    <text x="575" y="262" class="s" fill="#1E3A8A" text-anchor="middle">row group 3</text>
    <text x="575" y="292" class="s" fill="#1E3A8A" text-anchor="middle">row group 4</text>
    <text x="575" y="322" class="s" fill="#1E3A8A" text-anchor="middle">row group 5</text>
    <text x="575" y="352" class="s" fill="#1E3A8A" text-anchor="middle">row group 6</text>
    <text x="575" y="382" class="s" fill="#1E3A8A" text-anchor="middle">row group 7</text>
  </g>
  <g stroke="#059669" stroke-width="2" marker-end="url(#ag)">
    <line x1="630" y1="167" x2="750" y2="167"/>
    <line x1="630" y1="197" x2="750" y2="197"/>
    <line x1="630" y1="227" x2="750" y2="227"/>
    <line x1="630" y1="257" x2="750" y2="257"/>
    <line x1="630" y1="287" x2="750" y2="287"/>
    <line x1="630" y1="317" x2="750" y2="317"/>
    <line x1="630" y1="347" x2="750" y2="347"/>
    <line x1="630" y1="377" x2="750" y2="377"/>
  </g>
  <g>
    <rect x="755" y="154" width="150" height="26" rx="5" fill="#059669"/>
    <rect x="755" y="184" width="150" height="26" rx="5" fill="#059669"/>
    <rect x="755" y="214" width="150" height="26" rx="5" fill="#059669"/>
    <rect x="755" y="244" width="150" height="26" rx="5" fill="#059669"/>
    <rect x="755" y="274" width="150" height="26" rx="5" fill="#059669"/>
    <rect x="755" y="304" width="150" height="26" rx="5" fill="#059669"/>
    <rect x="755" y="334" width="150" height="26" rx="5" fill="#059669"/>
    <rect x="755" y="364" width="150" height="26" rx="5" fill="#059669"/>
    <text x="830" y="172" class="w" fill="#FFFFFF" text-anchor="middle">worker 1 · busy</text>
    <text x="830" y="202" class="w" fill="#FFFFFF" text-anchor="middle">worker 2 · busy</text>
    <text x="830" y="232" class="w" fill="#FFFFFF" text-anchor="middle">worker 3 · busy</text>
    <text x="830" y="262" class="w" fill="#FFFFFF" text-anchor="middle">worker 4 · busy</text>
    <text x="830" y="292" class="w" fill="#FFFFFF" text-anchor="middle">worker 5 · busy</text>
    <text x="830" y="322" class="w" fill="#FFFFFF" text-anchor="middle">worker 6 · busy</text>
    <text x="830" y="352" class="w" fill="#FFFFFF" text-anchor="middle">worker 7 · busy</text>
    <text x="830" y="382" class="w" fill="#FFFFFF" text-anchor="middle">worker 8 · busy</text>
  </g>
  <text x="830" y="420" class="cap" fill="#047857" text-anchor="middle">8 of 8 workers busy</text>
  <text x="830" y="436" class="s" text-anchor="middle">+ pyarrow threads inside each</text>
</svg>
